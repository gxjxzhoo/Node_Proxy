name: Self test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 加载共享变量（env-config）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: gxjxzhoo/env-config
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .shared-env
          persist-credentials: false

      - name: 应用共享变量
        shell: bash
        run: |
          f=.shared-env/.env
          if [ -f "$f" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"; value="${line#*=}"
              [ -z "$value" ] && continue
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done < "$f"
            echo "✅ 已加载 env-config"
          else
            echo "⚠️ 未读到 env-config（检查 PRIVATE_REPO_TOKEN），使用仓库 Secrets"
          fi
          rm -rf .shared-env
      - id: proxy
        continue-on-error: true
        uses: ./
        with:
          node-link: ${{ env.NODE_LINK }}
          export-proxy-env: "true"
      - name: Collect result
        if: always()
        shell: bash
        run: |
          mask() { sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/x.x.x.x/g'; }
          {
            echo "run: ${{ github.run_id }}"
            echo "env-config NODE_LINK present: ${{ env.NODE_LINK != '' }}"
            echo "action outcome: ${{ steps.proxy.outcome }}"
            echo "mode: ${{ steps.proxy.outputs.mode }}"
            echo "exit-ip: ${{ steps.proxy.outputs.exit-ip }}"
            echo "proxy-url set: ${{ steps.proxy.outputs.proxy-url != '' }}"
            echo "--- curl via exported proxy env"
            curl -s -m 20 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(loc|colo)=' || echo "curl failed"
            echo "--- sing-box process"
            pgrep -a sing-box | awk '{print $1, $2, $3}' || echo "none"
            echo "--- sing-box log"
            tail -20 "$RUNNER_TEMP/node-proxy/sing-box.log" 2>/dev/null | mask
          } > /tmp/result.txt 2>&1
          cat /tmp/result.txt
          { echo '```'; cat /tmp/result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
